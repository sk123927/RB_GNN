name: CI

on:
  push:
  pull_request:

jobs:
  data-and-parser-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run parser tests
        run: python -m unittest discover -s tests
      - name: Inspect bundled demo data
        run: python scripts/inspect_dataset.py --dataset demo/tiny
      - name: Inspect bundled ER data
        run: python scripts/inspect_dataset.py --dataset trigger/er1500

