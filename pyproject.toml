[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rbgnn"
version = "0.1.0"
description = "Clean implementation of RB-GNN for rumor blocking without knowing the diffusion model."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
  {name = "Ke Su"}
]
dependencies = [
  "numpy>=1.23",
  "networkx>=3.0",
  "scikit-learn>=1.2",
  "torch>=2.1",
  "torch-geometric>=2.4",
  "PyYAML>=6.0",
  "tqdm>=4.66"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[tool.setuptools.packages.find]
include = ["rbgnn*"]

[tool.ruff]
line-length = 100
target-version = "py39"

